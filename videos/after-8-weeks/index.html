<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>CoUp — After 8 Weeks (transparent)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Black.woff2") format("woff2"); font-weight: 900; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Vazirmatn", sans-serif; }

      #stack { position: absolute; inset: 0; transform: scale(1.2); display: flex; flex-direction: column; align-items: center; justify-content: center; direction: rtl; }
      #after { font-size: 58px; font-weight: 500; color: #2a3a63; line-height: 1.2; }
      #row { display: flex; align-items: center; gap: 30px; direction: rtl; margin-top: -10px; }
      #win { position: relative; width: 180px; height: 260px; overflow: hidden; }
      #col { position: absolute; left: 0; top: 0; width: 180px; }
      #col div { height: 260px; line-height: 260px; text-align: center; font-size: 250px; font-weight: 900; color: #2f63ec; }
      #weeks { font-size: 120px; font-weight: 900; color: #0f1933; line-height: 1.25; }

      /* week track: 8 pills, filled right → left */
      #track { display: flex; gap: 16px; direction: rtl; margin-top: 34px; }
      .pill { position: relative; width: 62px; height: 16px; border-radius: 8px; background: #cdd9f7; overflow: hidden; }
      .fill { position: absolute; inset: 0; border-radius: 8px; background: #2f63ec; transform-origin: 100% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="after-8-weeks" data-start="0" data-duration="2.1" data-width="1080" data-height="1080">
      <div id="stack">
        <div id="after">بعد از</div>
        <div id="row">
          <div id="win"><div id="col" data-layout-allow-overflow></div></div>
          <div id="weeks">هفته</div>
        </div>
        <div id="track"></div>
      </div>
    </div>

    <script>
      (function () {
        const H = 260;
        const col = document.getElementById("col");
        "۱۲۳۴۵۶۷۸۹".split("").forEach((d) => {
          const e = document.createElement("div");
          e.textContent = d;
          e.setAttribute("data-layout-allow-overflow", "");
          col.appendChild(e);
        });
        const track = document.getElementById("track");
        const pills = [], fills = [];
        for (let i = 0; i < 8; i++) {
          const p = document.createElement("div"); p.className = "pill";
          const f = document.createElement("div"); f.className = "fill";
          p.appendChild(f); track.appendChild(p); pills.push(p); fills.push(f);
        }

        const tl = gsap.timeline({ paused: true });

        // ---------- in ----------
        tl.fromTo("#after", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.02);
        tl.fromTo("#win", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 0.06);
        tl.fromTo("#weeks", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, 0.1);
        // pills unfold from the centre outwards
        pills.forEach((p, i) => {
          const d = Math.abs(i - 3.5);
          tl.fromTo(p, { opacity: 0, scaleX: 0.2, y: 18 }, { opacity: 1, scaleX: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.1 + d * 0.035);
        });
        fills.forEach((f) => tl.set(f, { scaleX: 0 }, 0));

        // ---------- weeks tick by ----------
        const wk = { w: 0 };
        const paint = () => {
          const w = wk.w, frac = w - Math.floor(w);
          const s = Math.sin(Math.PI * Math.min(1, Math.max(0, frac)));
          col.style.transform = "translateY(" + (-w * H).toFixed(2) + "px) scaleY(" + (1 + 0.06 * s).toFixed(3) + ")";
          col.style.filter = s > 0.02 ? "blur(" + (4 * s).toFixed(2) + "px)" : "none";
        };
        paint();
        const T = [0.42, 0.55, 0.665, 0.77, 0.875, 0.985, 1.105];
        const D = [0.11, 0.1, 0.09, 0.09, 0.095, 0.105, 0.26];
        for (let k = 1; k <= 7; k++) {
          tl.fromTo(wk, { w: k - 1 }, { w: k, duration: D[k - 1], ease: k === 7 ? "back.out(2.2)" : "expo.inOut", immediateRender: false, onUpdate: paint }, T[k - 1]);
        }
        // pill k fills as week k lands, with a small lift
        const lands = [0.3].concat(T.map((t, i) => t + D[i] * 0.5));
        lands.forEach((t, k) => {
          tl.to(fills[k], { scaleX: 1, duration: 0.18, ease: "power3.out" }, t);
          tl.fromTo(pills[k], { scaleY: 1 }, { scaleY: 1.5, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
        });

        // ---------- arrival on 8 ----------
        tl.fromTo("#win", { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 1.26);
        pills.forEach((p, i) => tl.fromTo(p, { y: 0 }, { y: -8, duration: 0.1, ease: "sine.out", yoyo: true, repeat: 1, immediateRender: false }, 1.38 + (7 - i) * 0.015));

        // ---------- out: lift away in a quick cascade ----------
        tl.to("#after", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.32, ease: "expo.in" }, 1.62);
        tl.to("#row", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.32, ease: "expo.in" }, 1.66);
        pills.forEach((p, i) => tl.to(p, { opacity: 0, y: -30, scaleX: 0.3, duration: 0.28, ease: "expo.in" }, 1.68 + Math.abs(i - 3.5) * 0.02));

        window.__timelines["after-8-weeks"] = tl;
      })();
    </script>
  </body>
</html>
