  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Black.woff2") format("woff2"); font-weight: 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; direction: rtl; }

        .gr-bg { position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 115%, #2458c4 0%, #0f2a6e 42%, #050a1a 78%, #02040a 100%); }
        .gr-halo { position: absolute; left: 218px; top: 60px; width: 500px; height: 420px; border-radius: 50%;

        /* ---------- session card ---------- */
        .gr-stage { position: absolute; inset: 0; perspective: 1300px; }
        .gr-sess { position: absolute; left: 213px; top: 92px; width: 510px; height: 470px; border-radius: 22px;

        .gr-sess-head { position: absolute; right: 26px; left: 26px; top: 22px; display: flex; align-items: center; gap: 12px; }

        .gr-sess-head span { display: block; font-size: 13.5px; color: #566079; line-height: 1.4; }
        .gr-row { position: absolute; right: 22px; left: 22px; height: 60px; border-radius: 12px; background: #e9efff;

        .gr-row svg { flex: none; }
        .gr-row .t { flex: 1; }
        .gr-row .t b { display: block; font-size: 17px; font-weight: 700; color: #1e2536; line-height: 1.25; }
        .gr-row .t span { display: block; font-size: 12.5px; color: #566079; line-height: 1.3; }
        .gr-st { height: 30px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .gr-st.ok { background: #dbe5ff; color: #4a67b8; }
        .gr-st.rest { background: #f7c9d3; color: #b3264a; }
        .gr-band { position: absolute; left: -40px; width: 600px; height: 70px; top: 0;
          background: linear-gradient(180deg, rgba(120, 160, 255, 0), rgba(120, 160, 255, 0.42), rgba(120, 160, 255, 0)); }

        /* ---------- dashboard ---------- */
        .gr-dstage { position: absolute; inset: 0; perspective: 1500px; }
        .gr-dash { position: absolute; left: 88px; top: 50px; width: 760px; height: 425px; border-radius: 18px;
          background: linear-gradient(180deg, #ffffff 0%, #f3f7ff 55%, #cfe0ff 100%);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.7); overflow: hidden; }
        .gr-dtitle { position: absolute; right: 26px; top: 16px; }
        .gr-dtitle b { display: block; font-size: 24px; font-weight: 900; color: #121829; line-height: 1.3; }
        .gr-dtitle span { display: block; font-size: 13px; color: #7a8399; }
        .gr-box { position: absolute; border-radius: 14px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 8px 24px rgba(50, 90, 200, 0.14), 0 0 0 1.5px #e6ecf8; padding: 12px 16px; }
        .gr-box h4 { font-size: 15px; font-weight: 700; color: #1a2134; line-height: 1.3; }
        .gr-box h5 { font-size: 11.5px; font-weight: 400; color: #8a92a6; line-height: 1.4; }
        .gr-big { font-size: 40px; font-weight: 900; color: #2f63e8; line-height: 1.35; direction: ltr; text-align: right; }
        .gr-big small { font-size: 20px; color: #8a93a8; font-weight: 700; }
        .gr-bars { position: absolute; left: 16px; bottom: 30px; width: 230px; height: 104px; display: flex; align-items: flex-end; gap: 10px; }
        .gr-bar { display: block; width: 22px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #5b8bff, #2f63e8); transform-origin: 50% 100%; }
        .gr-bar.soft { background: linear-gradient(180deg, #a9c2ff, #7ea3ff); }
        .gr-days { position: absolute; left: 16px; bottom: 10px; width: 230px; display: flex; gap: 10px; }
        .gr-days i { width: 22px; font-style: normal; font-size: 11px; color: #8a92a6; text-align: center; }
        .gr-flame { position: absolute; left: 18px; top: 16px; width: 64px; height: 64px; border-radius: 50%;
          background: radial-gradient(circle at 40% 35%, #ffd9a8, #ff8a3d 55%, #f0572a); display: flex; align-items: center; justify-content: center; }
        .gr-legend { position: absolute; right: 136px; top: 52px; display: flex; flex-direction: column; gap: 8px; }
        .gr-legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #394157; font-weight: 500; white-space: nowrap; }
        .gr-legend i { display: block; width: 10px; height: 22px; border-radius: 3px; }
        .gr-legend em { font-style: normal; color: #6f788e; margin-right: 10px; }
        .gr-recs { position: absolute; right: 16px; left: 16px; top: 54px; display: flex; justify-content: space-between; }
        .gr-rec b { display: block; direction: ltr; text-align: right; font-size: 24px; font-weight: 900; color: #1f9d62; line-height: 1.2; }
        .gr-rec span { display: block; font-size: 12.5px; color: #616a80; font-weight: 500; }
        .gr-load { position: absolute; left: 318px; top: 245px; width: 300px; height: 34px; border-radius: 10px; background: linear-gradient(90deg, #3d74ff, #6f9dff); }
        .gr-whiteout { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      </style>

      <div id="root" data-composition-id="growth" data-width="936" data-height="519">
        <div class="gr-bg" id="growth-bg"></div>
        <div class="gr-halo" id="growth-halo"></div>

        <!-- ===== live session tracker ===== -->
        <div class="gr-stage" id="growth-stage">
          <div class="gr-sess" id="growth-sess">
            <div class="gr-sess-head">
              <div class="gr-sess-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></div>
              <div><b>جلسه امروز</b><span>هر ست رو ثبت کن، بقیه‌ش با کوآپ</span></div>
            </div>
            <div class="gr-row" id="growth-r1" style="top: 90px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3f5fb0" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 3 4.5 4.8 4.5 9a4.5 4.5 0 0 1-9 0c0-1.7.8-3 1.7-3.9.2 1.6 1 2.4 1.9 2.7C11 8.3 11 5.6 12 3z"/></svg>
              <div class="t"><b>گرم کردن و هوازی</b><span>۱۰ دقیقه</span></div><div class="gr-st ok" id="growth-s1">انجام شد ✓</div>
            </div>
            <div class="gr-row" id="growth-r2" style="top: 162px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3f5fb0" stroke-width="2.2" stroke-linecap="round"><path d="M3 10v4M6.5 7.5v9M17.5 7.5v9M21 10v4M6.5 12h11"/></svg>
              <div class="t"><b>پرس سینه</b><span>۴ × ۸ · ۶۲٫۵ کیلو</span></div><div class="gr-st ok" id="growth-s2">انجام شد ✓</div>
            </div>
            <div class="gr-row" id="growth-r3" style="top: 234px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3f5fb0" stroke-width="2" stroke-linejoin="round"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>
              <div class="t"><b>اسکوات</b><span>۵ × ۵ · ۸۰ کیلو</span></div><div class="gr-st ok" id="growth-s3">انجام شد ✓</div>
            </div>
            <div class="gr-row warn" id="growth-r4" style="top: 306px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0395c" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 3h4"/></svg>
              <div class="t"><b>سوپرست زیربغل + فیس‌پول</b><span>ست ۲ از ۳</span></div><div class="gr-st rest">استراحت <span id="growth-timer">۹۰</span> ثانیه</div>
            </div>
            <div class="gr-row" id="growth-r5" style="top: 378px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3f5fb0" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M12 4v16"/></svg>
              <div class="t"><b>سرد کردن و کشش</b><span>۸ دقیقه</span></div>
            </div>
            <div class="gr-band" id="growth-band"></div>
          </div>
        </div>

        <!-- ===== progress dashboard ===== -->
        <div class="gr-dstage" id="growth-dstage">
          <div class="gr-dash" id="growth-dash">
            <div class="gr-dtitle"><b>گزارش پیشرفت تو</b><span>این هفته اینطوری گذشت</span></div>

            <div class="gr-box" id="growth-b1" style="right: 22px; top: 80px; width: 440px; height: 170px">
              <h4>امتیاز قدرت</h4><h5>بر اساس ست‌ها و وزنه‌های ثبت‌شده</h5>
              <div class="gr-big" style="margin-top: 6px"><span id="growth-score">۴٫۷</span><small> /۵</small></div>
              <h5>۱۲٪ قوی‌تر از هفته قبل</h5>
              <div class="gr-bars" id="growth-bars">
                <i class="gr-bar soft" style="height: 46px"></i><i class="gr-bar" style="height: 82px"></i><i class="gr-bar soft" style="height: 38px"></i>
                <i class="gr-bar" style="height: 70px"></i><i class="gr-bar" style="height: 92px"></i><i class="gr-bar soft" style="height: 58px"></i>
                <i class="gr-bar" style="height: 100px"></i>
              </div>
              <div class="gr-days"><i>ج</i><i>پ</i><i>چ</i><i>س</i><i>د</i><i>ی</i><i>ش</i></div>
            </div>

            <div class="gr-box" id="growth-b2" style="left: 22px; top: 80px; width: 262px; height: 170px">
              <h4>استریک تمرین</h4><h5>بدون حتی یک روز غیبت</h5>
              <div class="gr-big" style="margin-top: 16px; text-align: right"><span id="growth-streak">۲۱</span><small> روز</small></div>
              <div class="gr-flame"><svg width="30" height="30" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2c1.2 3.4 5.2 5.4 5.2 10.2a5.2 5.2 0 0 1-10.4 0c0-2 .9-3.4 2-4.5.2 1.9 1.1 2.8 2.2 3.1C11 7.5 11 4.8 12 2z"/></svg></div>
            </div>

            <div class="gr-box" id="growth-b3" style="right: 22px; top: 264px; width: 360px; height: 140px">
              <h4>تقسیم زمان تمرین</h4>
              <svg style="position: absolute; right: 16px; top: 40px" width="96" height="96" viewBox="0 0 96 96">
                <circle cx="48" cy="48" r="36" fill="none" stroke="#e7edfb" stroke-width="16" />
                <circle id="growth-seg1" cx="48" cy="48" r="36" fill="none" stroke="#2f63e8" stroke-width="16" transform="rotate(-90 48 48)" />
                <circle id="growth-seg2" cx="48" cy="48" r="36" fill="none" stroke="#6f9bff" stroke-width="16" transform="rotate(-90 48 48)" />
                <circle id="growth-seg3" cx="48" cy="48" r="36" fill="none" stroke="#b7ccff" stroke-width="16" transform="rotate(-90 48 48)" />
              </svg>
              <div class="gr-legend">
                <div><i style="background: #2f63e8"></i>قدرتی<em>۳٫۱ ساعت</em></div>
                <div><i style="background: #6f9bff"></i>هوازی<em>۲٫۲ ساعت</em></div>
                <div><i style="background: #b7ccff"></i>کشش<em>۱٫۵ ساعت</em></div>
              </div>
            </div>

            <div class="gr-box" id="growth-b4" style="left: 22px; top: 264px; width: 342px; height: 140px">
              <h4>رکوردهای جدید</h4><h5>در ۸ هفته با کوآپ</h5>
              <div class="gr-recs">
                <div class="gr-rec"><b id="growth-rec1">+۱۲٫۵</b><span>پرس سینه (کیلو)</span></div>
                <div class="gr-rec"><b id="growth-rec2">+۲۰</b><span>اسکوات (کیلو)</span></div>
                <div class="gr-rec"><b id="growth-rec3">−۱٫۸</b><span>وزن بدن (کیلو)</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="gr-load" id="growth-load"></div>
        <div class="gr-whiteout" id="growth-whiteout"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const fa = (s) => String(s).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]).replace(".", "٫");

          // navy stage fades up over the demo
          tl.fromTo("#growth-bg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
          tl.fromTo("#growth-halo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.1);

          // ---------- session tracker ----------
          tl.fromTo("#growth-sess", { opacity: 0, y: 200, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.15);
          const rows = ["#growth-r1", "#growth-r2", "#growth-r3", "#growth-r4", "#growth-r5"];
          tl.fromTo(rows, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.45);
          tl.fromTo(["#growth-s1", "#growth-s2", "#growth-s3"], { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, stagger: 0.12, ease: "back.out(2.4)" }, 0.8);
          const timer = document.getElementById("growth-timer");
          const clock = { s: 90 };
          tl.fromTo(clock, { s: 90 }, { s: 86, duration: 2.2, ease: "none", immediateRender: false, onUpdate: () => { timer.textContent = fa(Math.ceil(clock.s)); } }, 0.6);

          // 3D tilt with a light band passing over each row
          tl.to("#growth-sess", { rotationY: -16, rotationX: 9, rotationZ: 1.5, scale: 1.04, y: -10, duration: 1.2, ease: "power2.inOut" }, 1.1);
          tl.fromTo("#growth-band", { y: 70, opacity: 0 }, { y: 420, opacity: 1, duration: 1.1, ease: "power1.inOut" }, 1.25);
          tl.to("#growth-band", { opacity: 0, duration: 0.2 }, 2.35);

          // ---------- loading bar hand-off ----------
          tl.to("#growth-stage", { opacity: 0, scale: 0.92, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 2.4);
          tl.fromTo("#growth-load", { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.5);
          tl.to("#growth-load", { opacity: 0, scaleY: 0.3, duration: 0.25, ease: "power2.in" }, 2.85);

          // ---------- dashboard ----------
          tl.fromTo("#growth-dash", { opacity: 0, scale: 0.9, rotationX: 10 }, { opacity: 1, scale: 1, rotationX: 0, duration: 0.6, ease: "power3.out" }, 2.75);
          tl.fromTo(["#growth-b1", "#growth-b2", "#growth-b3", "#growth-b4"], { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, stagger: 0.1, ease: "power2.out" }, 2.95);
          tl.fromTo("#growth-bars .gr-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.55, stagger: 0.06, ease: "back.out(1.4)" }, 3.2);

          const score = document.getElementById("growth-score");
          const sc = { v: 0 };
          tl.fromTo(sc, { v: 0 }, { v: 4.7, duration: 0.9, ease: "power2.out", immediateRender: false, onUpdate: () => { score.textContent = fa(sc.v.toFixed(1)); } }, 3.15);
          const streak = document.getElementById("growth-streak");
          const st = { v: 0 };
          tl.fromTo(st, { v: 0 }, { v: 21, duration: 0.9, ease: "power2.out", immediateRender: false, onUpdate: () => { streak.textContent = fa(Math.round(st.v)); } }, 3.25);
          tl.fromTo(".gr-flame", { scale: 0.5, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, 3.35);

          // donut segments draw in turn (dash values in circumference units)
          const C = 2 * Math.PI * 36;
          const segs = [[0, 3.1], [3.1, 2.2], [5.3, 1.5]];
          segs.forEach(([start, len], i) => {
            const el = document.getElementById("growth-seg" + (i + 1));
            const frac = len / 6.8, off = start / 6.8;
            el.setAttribute("stroke-dashoffset", (-off * C).toFixed(2));
            tl.fromTo(el, { attr: { "stroke-dasharray": "0 " + C.toFixed(2) } },
              { attr: { "stroke-dasharray": (frac * C - 2).toFixed(2) + " " + C.toFixed(2) }, duration: 0.5, ease: "power2.out" }, 3.35 + i * 0.2);
          });
          tl.fromTo(["#growth-rec1", "#growth-rec2", "#growth-rec3"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.12, ease: "back.out(2)" }, 3.5);

          // slow push-in, then white-out into the CTA
          tl.fromTo("#growth-dash", { scale: 1 }, { scale: 1.05, y: 8, duration: 2.0, ease: "sine.inOut", immediateRender: false }, 3.4);
          tl.to("#growth-dstage", { filter: "blur(14px)", opacity: 0.5, duration: 0.45, ease: "power2.in" }, 5.3);
          tl.fromTo("#growth-whiteout", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.in" }, 5.35);

          window.__timelines["growth"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
