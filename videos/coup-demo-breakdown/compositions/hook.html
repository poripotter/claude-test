<!doctype html>
<html lang="fa">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Black.woff2") format("woff2"); font-weight: 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; direction: rtl; background: #ffffff; }

        .hk-bg { position: absolute; inset: 0;
          background:
            radial-gradient(60% 80% at 100% 100%, rgba(94, 145, 255, 0.85), rgba(94, 145, 255, 0) 70%),
            radial-gradient(40% 70% at 0% 40%, rgba(120, 165, 255, 0.55), rgba(120, 165, 255, 0) 70%),
            #f6f9ff; }
        .hk-wash { position: absolute; inset: 0; background: radial-gradient(90% 90% at 40% 50%, #6f9cff, #3f78ff); opacity: 1; }

        /* --- the hook word --- */
        .hk-word-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .hk-word {
          --p: 0%;
          display: block; font-size: 158px; font-weight: 900; color: #0c1222; letter-spacing: -0.01em; line-height: 1.25;
          -webkit-mask-image: linear-gradient(to left, #000 calc(var(--p) - 30%), rgba(0, 0, 0, 0.35) calc(var(--p) - 8%), transparent var(--p));
                  mask-image: linear-gradient(to left, #000 calc(var(--p) - 30%), rgba(0, 0, 0, 0.35) calc(var(--p) - 8%), transparent var(--p));
          will-change: transform, filter;
        }
        .hk-edge { position: absolute; top: 90px; width: 260px; height: 340px; left: 0;
          background: radial-gradient(closest-side, rgba(70, 125, 255, 0.75), rgba(70, 125, 255, 0)); }

        /* --- app window (weekly training calendar) --- */
        .hk-stage { position: absolute; inset: 0; perspective: 1500px; }
        .hk-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
        .hk-cal {
          position: absolute; left: 88px; top: 44px; width: 760px; height: 470px; border-radius: 18px; background: #ffffff;
          box-shadow: 0 30px 70px rgba(45, 90, 200, 0.28), 0 0 0 1.5px #e3e9f7; transform-origin: 50% 60%; overflow: hidden;
        }
        .hk-head { position: absolute; top: 20px; right: 24px; left: 24px; height: 44px; display: flex; align-items: center; gap: 10px; }
        .hk-today { width: 92px; height: 40px; border-radius: 10px; border: 1.5px solid #d7def0; background: #fff;
          display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; color: #3b4254; }
        .hk-arrow { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid #e0e5f2; color: #8a93a8; font-size: 18px;
          display: flex; align-items: center; justify-content: center; }
        .hk-date { margin-right: 60px; font-size: 22px; font-weight: 700; color: #151a28; }
        .hk-row { position: absolute; right: 24px; left: 24px; height: 1.5px; background: #edf0f7; }
        .hk-time { position: absolute; right: 24px; font-size: 14px; font-weight: 500; color: #7a8296; }
        .hk-ev { position: absolute; height: 50px; border-radius: 9px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; }
        .hk-ev b { font-size: 15px; font-weight: 700; color: #22293b; line-height: 1.3; }
        .hk-ev span { font-size: 12px; font-weight: 400; color: #5d6579; line-height: 1.3; }
        .ev-blue { background: #e1e9ff; box-shadow: inset 0 0 0 1.5px #c3d3ff; }
        .ev-sand { background: #f6eedb; box-shadow: inset 0 0 0 1.5px #eadcb8; }
        .ev-lav { background: #e9e3fc; box-shadow: inset 0 0 0 1.5px #d4c9f7; }
        .ev-mint { background: #dff4e7; box-shadow: inset 0 0 0 1.5px #bfe6cd; }

        /* month popover */
        .hk-pop { position: absolute; top: 70px; right: 20px; width: 300px; height: 262px; border-radius: 14px; background: #fff;
          box-shadow: 0 18px 44px rgba(40, 70, 160, 0.22), 0 0 0 1.5px #e6ebf6; transform-origin: 85% 0%; padding: 14px 16px; }
        .hk-pop-head { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; color: #1a2030; margin-bottom: 8px; }
        .hk-pop-head i { font-style: normal; color: #5f6880; font-size: 18px; }
        .hk-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 5px; text-align: center; }
        .hk-grid .wd { font-size: 11px; font-weight: 700; color: #8b93a7; }
        .hk-grid .d { position: relative; font-size: 13px; font-weight: 500; color: #283043; height: 28px; line-height: 28px; }
        .hk-grid .d.muted { color: #b8bfcf; }
        .hk-sel { position: absolute; left: 0; top: 0; z-index: 0; width: 30px; height: 28px; border-radius: 7px; background: #cddcff; box-shadow: inset 0 0 0 1.5px #9db8ff; }
        .hk-chip { position: absolute; width: 176px; height: 54px; border-radius: 10px; padding: 7px 12px; display: flex; flex-direction: column; justify-content: center; }
        .hk-chip b { font-size: 14px; font-weight: 700; color: #22293b; line-height: 1.3; }
        .hk-chip span { font-size: 11.5px; color: #5d6579; line-height: 1.3; }

        .hk-cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 9; }
        .hk-blur { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 50%, rgba(220, 232, 255, 0.9), rgba(140, 180, 255, 0.95)); opacity: 0; }
      </style>

      <div id="root" data-composition-id="hook" data-width="936" data-height="519">
        <div class="hk-bg"></div>

        <!-- phase A: kinetic hook word -->
        <div class="hk-wash" id="hook-wash"></div>
        <div class="hk-edge" id="hook-edge"></div>
        <div class="hk-word-wrap"><div class="hk-word" id="hook-word">بدون برنامه؟</div></div>

        <!-- phase B: training calendar -->
        <div class="hk-stage" id="hook-stage">
          <div class="hk-world" id="hook-world">
            <div class="hk-cal" id="hook-cal">
              <div class="hk-head">
                <div class="hk-today" id="hook-today">امروز</div>
                <div class="hk-arrow">›</div><div class="hk-arrow">‹</div>
                <div class="hk-date">چهارشنبه، ۱ مهر ۱۴۰۵</div>
              </div>
              <div class="hk-row" style="top: 96px"></div><div class="hk-time" style="top: 104px">۷:۰۰</div>
              <div class="hk-row" style="top: 190px"></div><div class="hk-time" style="top: 198px">۱۰:۰۰</div>
              <div class="hk-row" style="top: 284px"></div><div class="hk-time" style="top: 292px">۱۸:۰۰</div>
              <div class="hk-row" style="top: 378px"></div><div class="hk-time" style="top: 386px">۲۱:۰۰</div>

              <div class="hk-ev ev-blue" style="top: 108px; right: 120px; width: 210px"><b>دویدن صبحگاهی</b><span>۶:۳۰ تا ۷:۳۰</span></div>
              <div class="hk-ev ev-sand" style="top: 118px; left: 36px; width: 190px"><b>صبحانه پروتئینی</b><span>۸:۰۰ تا ۸:۳۰</span></div>
              <div class="hk-ev ev-blue" style="top: 204px; right: 200px; width: 250px"><b>وزن‌کشی هفتگی</b><span>۱۰:۰۰ · یادآوری</span></div>
              <div class="hk-ev ev-lav" style="top: 296px; right: 330px; width: 220px"><b>باشگاه · روز سینه</b><span>۱۷:۳۰ تا ۱۹:۰۰</span></div>
              <div class="hk-ev ev-mint" style="top: 392px; right: 150px; width: 200px"><b>کشش و ریکاوری</b><span>۲۱:۰۰ تا ۲۱:۲۰</span></div>

              <div class="hk-pop" id="hook-pop">
                <div class="hk-pop-head"><i>›</i><span>مهر ۱۴۰۵</span><i>‹</i></div>
                <div class="hk-grid" id="hook-grid"></div>
                <div class="hk-sel" id="hook-sel"></div>
              </div>

              <div class="hk-chip ev-lav" id="hook-chip-a1" style="top: 92px; right: 336px"><b>روز سینه · ۶۰ کیلو</b><span>۴ حرکت · ۵۵ دقیقه</span></div>
              <div class="hk-chip ev-blue" id="hook-chip-b1" style="top: 214px; right: 336px"><b>هوازی ۲۰ دقیقه</b><span>تردمیل · شیب ۶</span></div>
              <div class="hk-chip ev-lav" id="hook-chip-a2" style="top: 92px; right: 336px"><b>روز پا · اسکوات</b><span>۵ حرکت · ۶۰ دقیقه</span></div>
              <div class="hk-chip ev-mint" id="hook-chip-b2" style="top: 214px; right: 336px"><b>کشش ۱۰ دقیقه</b><span>بعد از تمرین</span></div>
              <div class="hk-chip ev-sand" id="hook-chip-a3" style="top: 92px; right: 336px"><b>استراحت فعال</b><span>ریکاوری عضلات</span></div>
              <div class="hk-chip ev-blue" id="hook-chip-b3" style="top: 214px; right: 336px"><b>پیاده‌روی ۳۰ دقیقه</b><span>۴۰۰۰ قدم</span></div>

              <svg class="hk-cursor" id="hook-cursor" viewBox="0 0 32 32">
                <path d="M11 3.5c1.1 0 2 .9 2 2V14l.6-.1V11c0-1.1.9-2 2-2s2 .9 2 2v3l.5-.1v-1.9c0-1.1.9-2 2-2s2 .9 2 2v2.4l.4-.1c1.1 0 2 .9 2 2V22c0 3.9-3.1 7-7 7h-2.3c-2 0-3.9-.9-5.2-2.4L4.6 20.6c-.7-.8-.7-2.1.1-2.8.8-.7 2-.7 2.8 0L9 19.3V5.5c0-1.1.9-2 2-2z" fill="#ffffff" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M13.6 14.2v5M17.6 14v5M21.6 14.4v4.6" stroke="#111827" stroke-width="1.3" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </div>
        <div class="hk-blur" id="hook-blur"></div>
      </div>

      <script>
        (function () {
          // month grid for Mehr 1405 — starts on Wednesday (week starts Saturday)
          const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
          const grid = document.getElementById("hook-grid");
          ["ش", "ی", "د", "س", "چ", "پ", "ج"].forEach((w) => { const e = document.createElement("div"); e.className = "wd"; e.textContent = w; grid.appendChild(e); });
          const cells = [28, 29, 30, 31].map((d) => [d, true]);
          for (let d = 1; d <= 30; d++) cells.push([d, false]);
          cells.push([1, true]);
          cells.forEach(([d, m]) => { const e = document.createElement("div"); e.className = "d" + (m ? " muted" : ""); e.textContent = fa(d); grid.appendChild(e); });

          // selection square positions (popover-local, RTL columns). col 0 is the rightmost.
          const COLW = (300 - 32) / 7, ROW0 = 14 + 22 + 8 + 16 + 5;  // pad + head + gap + weekday row + row-gap
          const selPos = (idx) => ({ x: 300 - 16 - (idx % 7 + 1) * COLW + (COLW - 30) / 2, y: ROW0 + Math.floor(idx / 7) * 33 });
          const s1 = selPos(4), s2 = selPos(5), s3 = selPos(6);

          // the month popover and day chips deliberately sit over the day's events
          document.querySelectorAll("#hook-cal b, #hook-cal span, #hook-cal .hk-time, #hook-grid div, .hk-pop-head i, #hook-today, .hk-arrow")
            .forEach((el) => { el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", ""); });

          const tl = gsap.timeline({ paused: true });

          // ---------- phase A: hook word blur-wipes in right → left ----------
          tl.fromTo("#hook-word", { "--p": "0%", filter: "blur(14px)", scale: 1.08 }, { "--p": "140%", filter: "blur(0px)", scale: 1, duration: 1.35, ease: "power2.out" }, 0.05);
          tl.fromTo("#hook-edge", { x: 700, opacity: 1 }, { x: -120, opacity: 0.2, duration: 1.4, ease: "power2.out" }, 0.05);
          tl.fromTo("#hook-wash", { opacity: 1 }, { opacity: 0, duration: 1.1, ease: "power2.out" }, 0.1);
          tl.to("#hook-word", { scale: 1.035, duration: 0.45, ease: "sine.inOut" }, 1.42);
          tl.to("#hook-word", { opacity: 0, filter: "blur(22px)", scale: 1.22, duration: 0.35, ease: "power2.in" }, 1.9);
          tl.to("#hook-edge", { opacity: 0, duration: 0.3 }, 1.9);

          // ---------- phase B: calendar swings in on a 3D tilt ----------
          tl.fromTo("#hook-cal",
            { opacity: 0, rotationX: 32, rotationY: 20, rotationZ: -4, scale: 0.78, y: 80, filter: "blur(10px)" },
            { opacity: 1, rotationX: 9, rotationY: -7, rotationZ: -1.5, scale: 0.95, y: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out" }, 2.05);
          tl.to("#hook-cal", { rotationX: 6, rotationY: -4, rotationZ: -1, scale: 0.97, duration: 1.3, ease: "sine.inOut" }, 3.15);
          tl.set(["#hook-pop", "#hook-chip-a1", "#hook-chip-b1", "#hook-chip-a2", "#hook-chip-b2", "#hook-chip-a3", "#hook-chip-b3"], { opacity: 0 }, 0);

          // cursor glides to "today" and clicks (cursor lives inside the tilted window)
          const TODAY = { x: 760 - 24 - 46, y: 20 + 20 };
          tl.fromTo("#hook-cursor", { x: 60, y: 430, opacity: 0 }, { x: 360, y: 300, opacity: 1, duration: 0.5, ease: "power1.out" }, 2.85);
          tl.to("#hook-cursor", { x: TODAY.x - 16, y: TODAY.y - 6, duration: 0.52, ease: "power3.inOut" }, 3.36);
          tl.to(["#hook-cursor", "#hook-today"], { scale: 0.86, duration: 0.09, ease: "power1.in" }, 3.88);
          tl.to(["#hook-cursor", "#hook-today"], { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.97);
          tl.to("#hook-today", { backgroundColor: "#e3ebff", duration: 0.1 }, 3.9);

          // month popover springs from the button
          tl.fromTo("#hook-pop", { opacity: 0, scale: 0.6, y: -10 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 4.0);
          tl.set("#hook-sel", { x: s1.x, y: s1.y }, 0);
          tl.to("#hook-cursor", { x: 520, y: 170, duration: 0.5, ease: "power2.inOut" }, 4.3);

          // camera pushes in on the popover + day chips; window flattens
          tl.to("#hook-cal", { rotationX: 0, rotationY: 0, rotationZ: 0, scale: 1, duration: 0.9, ease: "power2.inOut" }, 4.5);
          tl.fromTo("#hook-world", { scale: 1, x: 0, y: 0 }, { scale: 1.6, x: -182, y: 60, duration: 1.0, ease: "power3.inOut" }, 4.55);
          tl.fromTo(["#hook-chip-a1", "#hook-chip-b1"], { opacity: 0, x: 40, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, stagger: 0.08, ease: "power2.out" }, 5.0);

          // day 1 → 2 → 3: selection hops, chips swap with a blur crossfade
          const hop = (at, pos, outA, outB, inA, inB) => {
            tl.to("#hook-cursor", { x: 440 + pos.x, y: 70 + pos.y + 9, duration: 0.3, ease: "power2.inOut" }, at - 0.32);
            tl.to("#hook-sel", { x: pos.x, y: pos.y, duration: 0.3, ease: "power3.inOut" }, at);
            tl.to([outA, outB], { opacity: 0, x: -30, filter: "blur(6px)", duration: 0.25, ease: "power1.in" }, at);
            tl.fromTo([inA, inB], { opacity: 0, x: 40, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.35, stagger: 0.06, ease: "power2.out" }, at + 0.15);
          };
          hop(5.75, s2, "#hook-chip-a1", "#hook-chip-b1", "#hook-chip-a2", "#hook-chip-b2");
          hop(6.35, s3, "#hook-chip-a2", "#hook-chip-b2", "#hook-chip-a3", "#hook-chip-b3");

          // ---------- out: everything melts into a soft blue blur ----------
          tl.to("#hook-stage", { filter: "blur(18px)", opacity: 0.35, scale: 1.04, duration: 0.6, ease: "power2.in" }, 6.85);
          tl.fromTo("#hook-blur", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 6.95);

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
