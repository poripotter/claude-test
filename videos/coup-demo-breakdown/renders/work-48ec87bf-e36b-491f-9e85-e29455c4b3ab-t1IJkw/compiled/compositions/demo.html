    <template>
      <style>

        .dm-side { position: absolute; inset: 0;
          background: radial-gradient(40% 60% at 0% 100%, rgba(120, 165, 255, 0.55), rgba(120, 165, 255, 0) 70%),

        .dm-wave { position: absolute; top: 200px; height: 120px; direction: ltr; display: flex; align-items: center; gap: 5px; }
        .dm-bar { display: block; width: 3.5px; height: 120px; border-radius: 3px; background: rgba(255, 255, 255, 0.95); transform-origin: 50% 50%; }
        .dm-orb { position: absolute; left: 393px; top: 185px; width: 150px; height: 150px; border-radius: 50%;
          background: radial-gradient(circle at 36% 30%, #b3cdff 0%, #5d8fff 38%, #2f67f5 72%, #2350dc 100%);
          box-shadow: 0 18px 50px rgba(40, 90, 240, 0.45), inset 0 -8px 22px rgba(20, 50, 170, 0.35), inset 0 6px 16px rgba(255, 255, 255, 0.35);

        .dm-ib { display: block; width: 13px; height: 56px; border-radius: 7px; background: #ffffff; }

        .dm-pill span { font-size: 19px; font-weight: 500; color: #ffffff; white-space: nowrap; }

        /* ---------- plan list layer ---------- */
        .dm-stage { position: absolute; inset: 0; perspective: 1400px; }

        .dm-card { position: absolute; left: -30px; top: 20px; width: 760px; height: 520px; border-radius: 22px; background: #ffffff;
          box-shadow: 0 30px 70px rgba(40, 90, 210, 0.3), 0 0 0 2px #e4eaf8; }
        .dm-card-head { position: absolute; right: 30px; top: 22px; left: 30px; display: flex; align-items: center; gap: 14px; }
        .dm-card-ico { width: 46px; height: 46px; border-radius: 12px; background: #eaf0ff; display: flex; align-items: center; justify-content: center; }

        .dm-title { font-size: 21px; font-weight: 500; color: #1d2436; flex: 1; white-space: nowrap; }

        /* ---------- schedule layer ---------- */
        .dm-sch-stage { position: absolute; inset: 0; perspective: 1500px; }
        .dm-sch { position: absolute; left: 70px; top: 70px; width: 800px; height: 520px; border-radius: 20px; background: #ffffff;

        .dm-sch-head { position: absolute; top: 22px; right: 26px; left: 26px; height: 44px; display: flex; align-items: center; gap: 10px; }
        .dm-today { width: 96px; height: 40px; border-radius: 10px; border: 1.5px solid #d7def0; display: flex; align-items: center; justify-content: center;
          font-size: 17px; font-weight: 500; color: #3b4254; }
        .dm-arrow { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid #e0e5f2; color: #8a93a8; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .dm-sch-date { margin-right: 90px; font-size: 25px; font-weight: 700; color: #151a28; }
        .dm-time { position: absolute; right: 28px; font-size: 16px; font-weight: 500; color: #6e778c; }
        .dm-ev { position: absolute; height: 58px; border-radius: 10px; padding: 7px 14px; display: flex; flex-direction: column; justify-content: center; }
        .dm-ev b { font-size: 17px; font-weight: 700; color: #22293b; line-height: 1.3; white-space: nowrap; }
        .dm-ev span { font-size: 13px; color: #5d6579; line-height: 1.3; white-space: nowrap; }
        .ev-blue { background: #e1e9ff; box-shadow: inset 0 0 0 1.5px #c3d3ff; }
        .ev-lav { background: #e9e3fc; box-shadow: inset 0 0 0 1.5px #d4c9f7; }
        .ev-mint { background: #dff4e7; box-shadow: inset 0 0 0 1.5px #bfe6cd; }
        .ev-sand { background: #f6eedb; box-shadow: inset 0 0 0 1.5px #eadcb8; }
        .dm-sweep { position: absolute; height: 58px; border-radius: 10px; background: linear-gradient(90deg, #7b5cff, #9c7dff); box-shadow: 0 10px 26px rgba(110, 80, 240, 0.4); }
        .dm-badge { position: absolute; height: 30px; padding: 0 12px; border-radius: 15px; background: #7b5cff; color: #fff; font-size: 14px; font-weight: 700;
          display: flex; align-items: center; white-space: nowrap; box-shadow: 0 8px 20px rgba(110, 80, 240, 0.35); }
        .dm-veil { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      </style>

      <div id="root" data-composition-id="demo" data-width="936" data-height="519">
        <div class="dm-bg"></div>
        <div class="dm-side" id="demo-side"></div>

        <!-- ===== voice prompt ===== -->
        <div class="dm-voice" id="demo-voice">
          <div class="dm-glow" id="demo-glow"></div>
          <div class="dm-wave" id="demo-wave-l" style="right: 553px"></div>
          <div class="dm-wave" id="demo-wave-r" style="left: 553px"></div>
          <div class="dm-orb" id="demo-orb"><i class="dm-ib" id="demo-ib1"></i><i class="dm-ib" id="demo-ib2"></i><i class="dm-ib" id="demo-ib3"></i></div>
          <div class="dm-pill" id="demo-pill"><span id="demo-prompt"></span></div>
        </div>

        <!-- ===== generated plan ===== -->
        <div class="dm-stage" id="demo-stage">
          <div class="dm-world" id="demo-world">
            <div class="dm-card" id="demo-card">
              <div class="dm-card-head">
                <div class="dm-card-ico">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
                </div>
                <div><b>برنامه امروزت</b><span>ساخته‌شده توسط مربی هوشمند کوآپ · هدف: قوی‌تر شدن</span></div>
              </div>
            </div>
            <div class="dm-item" id="demo-i1" style="top: 104px">
              <div class="dm-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 3 4.5 4.8 4.5 9a4.5 4.5 0 0 1-9 0c0-1.7.8-3 1.7-3.9.2 1.6 1 2.4 1.9 2.7C11 8.3 11 5.6 12 3z"/></svg></div>
              <div class="dm-num">۱</div><div class="dm-title">گرم کردن و هوازی</div><div class="dm-dur">۱۰ دقیقه</div>
            </div>
            <div class="dm-item" id="demo-i2" style="top: 190px">
              <div class="dm-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2.2" stroke-linecap="round"><path d="M3 10v4M6.5 7.5v9M17.5 7.5v9M21 10v4M6.5 12h11"/></svg></div>
              <div class="dm-num">۲</div><div class="dm-title">پرس سینه · ۴ ست × ۸ تکرار · ۶۰ کیلو</div><div class="dm-dur">۲۰ دقیقه</div>
            </div>
            <div class="dm-item" id="demo-i3" style="top: 276px">
              <div class="dm-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linejoin="round"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></div>
              <div class="dm-num">۳</div><div class="dm-title">اسکوات · ۵ ست × ۵ تکرار</div><div class="dm-dur">۲۰ دقیقه</div>
            </div>
            <div class="dm-item" id="demo-i4" style="top: 362px">
              <div class="dm-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg></div>
              <div class="dm-num">۴</div><div class="dm-title">سوپرست: زیربغل دمبل + فیس‌پول</div><div class="dm-dur">۱۵ دقیقه</div>
            </div>
            <div class="dm-item" id="demo-i5" style="top: 448px">
              <div class="dm-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f73f5" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 3h4"/></svg></div>
              <div class="dm-num">۵</div><div class="dm-title">سرد کردن و کشش</div><div class="dm-dur">۸ دقیقه</div>
            </div>
          </div>
        </div>

        <!-- ===== schedule with progressive overload ===== -->
        <div class="dm-sch-stage" id="demo-sch-stage">
          <div class="dm-sch" id="demo-sch">
            <div class="dm-sch-head">
              <div class="dm-today">امروز</div><div class="dm-arrow">›</div><div class="dm-arrow">‹</div>
              <div class="dm-sch-date">چهارشنبه، ۱ مهر ۱۴۰۵</div>
            </div>
            <div class="dm-time" style="top: 104px">۷:۰۰</div>
            <div class="dm-time" style="top: 214px">۱۷:۰۰</div>
            <div class="dm-time" style="top: 330px">۱۹:۰۰</div>
            <div class="dm-ev ev-blue" style="top: 96px; right: 130px; width: 230px"><b>دویدن صبحگاهی</b><span>۶:۳۰ تا ۷:۳۰</span></div>
            <div class="dm-ev ev-sand" style="top: 104px; left: 34px; width: 210px"><b>وزن‌کشی هفتگی</b><span>۸:۰۰ · ۷۸٫۴ کیلو</span></div>
            <div class="dm-ev ev-blue" id="demo-bench" style="top: 170px; right: 130px; width: 300px"><b style="position: relative"><em id="demo-bench-a" style="font-style: normal">پرس سینه · ۶۰ کیلو</em><em id="demo-bench-b" style="font-style: normal; position: absolute; right: 0; top: 0; opacity: 0">پرس سینه · ۶۲٫۵ کیلو</em></b><span>۴ ست × ۸ تکرار</span></div>
            <div class="dm-ev ev-lav" style="top: 240px; right: 250px; width: 270px"><b>اسکوات · ۸۰ کیلو</b><span>۵ ست × ۵ تکرار</span></div>
            <div class="dm-ev ev-mint" style="top: 322px; right: 130px; width: 240px"><b>سرد کردن و کشش</b><span>۱۹:۰۰ تا ۱۹:۱۰</span></div>
            <div class="dm-sweep" id="demo-sweep" style="top: 170px; right: 130px; width: 300px"></div>
            <div class="dm-badge" id="demo-badge" style="top: 184px; right: 446px">افزایش تدریجی بار · +۲٫۵ کیلو</div>
          </div>
        </div>
        <div class="dm-veil" id="demo-veil"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // ---------- build the waveform (index-derived, no randomness) ----------
          const bars = [];
          ["demo-wave-l", "demo-wave-r"].forEach((id, side) => {
            const wrap = document.getElementById(id);
            for (let i = 0; i < 40; i++) {
              const b = document.createElement("i");
              b.className = "dm-bar";
              wrap.appendChild(b);
              // k = distance from the orb: the left wave's last bar and the right wave's first bar touch it
              const k = side === 0 ? 39 - i : i;
              bars.push({ el: b, k, seed: (k * 37 + side * 11) % 17 });
            }
          });
          const drawWave = (t, amp) => {
            for (const b of bars) {
              const env = Math.max(0.08, 1 - b.k / 44);
              const osc = 0.35 + 0.65 * Math.abs(Math.sin(t * 7.3 + b.k * 0.62 + b.seed * 0.4) * Math.cos(t * 2.1 + b.seed));
              b.el.style.transform = "scaleY(" + (0.06 + amp * env * osc).toFixed(3) + ")";
            }
          };
          drawWave(0, 0);

          // ---------- voice prompt ----------
          tl.fromTo("#demo-orb", { scale: 0.35, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.5)" }, 0.05);
          tl.fromTo("#demo-glow", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.05);
          tl.to("#demo-glow", { scale: 1.08, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);
          const wave = { t: 0, a: 0 };
          tl.fromTo(wave, { t: 0, a: 0 }, { t: 3.3, a: 1, duration: 3.3, ease: "none", immediateRender: false, onUpdate: () => drawWave(wave.t, Math.min(1, wave.t / 0.6) * (wave.t > 2.7 ? Math.max(0, (3.3 - wave.t) / 0.6) : 1)) }, 0.05);
          ["#demo-ib1", "#demo-ib2", "#demo-ib3"].forEach((id, i) => {
            tl.fromTo(id, { scaleY: 0.55 }, { scaleY: 1, duration: 0.28 + i * 0.05, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.3 + i * 0.07);
          });

          tl.fromTo("#demo-pill", { scaleX: 0.15, opacity: 0, filter: "blur(8px)" }, { scaleX: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55);
          const PROMPT = "«یه برنامه ۴ روزه بساز که قوی‌تر بشم»";
          const pOut = document.getElementById("demo-prompt");
          const typer = { n: 0 };
          tl.fromTo(typer, { n: 0 }, { n: PROMPT.length, duration: 1.4, ease: "none", immediateRender: false, onUpdate: () => { pOut.textContent = PROMPT.slice(0, Math.round(typer.n)); } }, 0.75);

          // out: pill tilts away, orb + wave blur off
          tl.to("#demo-pill", { rotation: -3, y: -6, duration: 0.4, ease: "power2.out" }, 2.75);
          tl.to("#demo-voice", { opacity: 0, filter: "blur(16px)", scale: 1.05, duration: 0.45, ease: "power2.in" }, 3.0);
          tl.fromTo("#demo-side", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.1);

          // ---------- plan list flies in close to camera, then pulls back into a card ----------
          const items = ["#demo-i1", "#demo-i2", "#demo-i3", "#demo-i4", "#demo-i5"];
          tl.fromTo("#demo-world", { scale: 1.45, rotationX: 16, rotationZ: -3, y: 70 }, { scale: 1.4, rotationX: 8, rotationZ: -1.5, y: 20, duration: 1.8, ease: "power2.out" }, 3.15);
          tl.fromTo(items, { opacity: 0, y: -90, rotationX: -55, filter: "blur(10px)" }, { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.6, stagger: 0.09, ease: "power3.out" }, 3.2);
          tl.set("#demo-card", { opacity: 0 }, 0);
          tl.to("#demo-world", { scale: 0.74, rotationX: 0, rotationZ: 0, y: -44, duration: 1.0, ease: "power3.inOut" }, 5.0);
          tl.fromTo("#demo-card", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 5.35);
          tl.to("#demo-world", { y: -54, rotationY: -4, duration: 0.9, ease: "sine.inOut" }, 6.0);

          // hand-off to the schedule: card drops away and blurs
          tl.to("#demo-stage", { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 6.85);

          // ---------- schedule rises in from below ----------
          tl.fromTo("#demo-sch", { opacity: 0, y: 260, rotationX: 38, scale: 0.9 }, { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 7.0);
          tl.to("#demo-sch", { y: -12, duration: 2.2, ease: "sine.inOut" }, 7.8);

          // progressive overload: a purple block sweeps across and lands on the bench-press slot
          tl.set("#demo-sweep", { opacity: 0 }, 0);
          tl.set("#demo-badge", { opacity: 0 }, 0);
          tl.fromTo("#demo-sweep", { opacity: 0, x: -420, scaleX: 0.55 }, { opacity: 1, x: -150, scaleX: 0.55, duration: 0.35, ease: "power2.in" }, 8.1);
          tl.to("#demo-sweep", { x: 0, scaleX: 1, duration: 0.4, ease: "back.out(1.4)" }, 8.45);
          tl.set("#demo-bench-a", { opacity: 0 }, 8.7);
          tl.set("#demo-bench-b", { opacity: 1 }, 8.7);
          tl.set("#demo-bench", { backgroundColor: "#e9e3fc", boxShadow: "inset 0 0 0 1.5px #b9a6fb" }, 8.7);
          tl.to("#demo-sweep", { opacity: 0, duration: 0.35, ease: "power1.out" }, 8.75);
          tl.fromTo("#demo-badge", { opacity: 0, scale: 0.6, x: 20 }, { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(2)" }, 8.8);

          window.__timelines["demo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
