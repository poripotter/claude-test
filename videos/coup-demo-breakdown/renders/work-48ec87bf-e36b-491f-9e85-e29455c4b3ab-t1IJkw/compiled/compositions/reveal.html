<!doctype html>
<html lang="fa">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; direction: rtl; background: #ffffff; }

        .rv-bg { position: absolute; inset: 0;
          background:
            radial-gradient(55% 75% at 0% 0%, rgba(120, 165, 255, 0.75), rgba(120, 165, 255, 0) 70%),
            radial-gradient(45% 65% at 100% 100%, rgba(110, 158, 255, 0.55), rgba(110, 158, 255, 0) 70%),
            #f7faff; }
        .rv-haze { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 50%, rgba(220, 232, 255, 0.9), rgba(140, 180, 255, 0.95)); }

        .rv-h, .rv-v { position: absolute; }
        .rv-h { left: 0; width: 936px; height: 0; border-top: 2px dashed rgba(110, 150, 240, 0.55); }
        .rv-v { top: 0; height: 519px; width: 0; border-left: 2px dashed rgba(110, 150, 240, 0.55); }
        .rv-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; background: #86a8f5; border-radius: 2px; }

        .rv-logo-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .rv-logo { --m: 0%; display: block; font-size: 78px; font-weight: 700; color: #5b80e6; line-height: 1.2;
          -webkit-mask-image: linear-gradient(to right, transparent var(--m), #000 calc(var(--m) + 6%), #000 calc(94% - var(--m)), transparent calc(100% - var(--m)));
                  mask-image: linear-gradient(to right, transparent var(--m), #000 calc(var(--m) + 6%), #000 calc(94% - var(--m)), transparent calc(100% - var(--m))); }

        .rv-panel { position: absolute; left: 13px; top: 13px; width: 910px; height: 493px; border-radius: 14px; overflow: hidden;
          background: radial-gradient(70% 90% at 25% 15%, #7aa4ff 0%, #4f86ff 45%, #2f6cff 100%); transform-origin: 50% 50%; }
        .rv-sheen { position: absolute; top: -120px; left: -420px; width: 700px; height: 700px;
          background: radial-gradient(closest-side, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0)); }
        .rv-line { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .rv-type { display: flex; align-items: center; gap: 4px; font-size: 38px; font-weight: 500; color: #ffffff; line-height: 1.4; white-space: nowrap; }
        .rv-caret { display: block; width: 3px; height: 44px; background: #ffffff; }
      </style>

      <div id="root" data-composition-id="reveal" data-width="936" data-height="519">
        <div class="rv-bg"></div>

        <!-- guide lines framing the wordmark -->
        <div class="rv-h" id="reveal-h1" style="top: 212px"></div>
        <div class="rv-h" id="reveal-h2" style="top: 308px"></div>
        <div class="rv-v" id="reveal-v1" style="left: 380px"></div>
        <div class="rv-v" id="reveal-v2" style="left: 556px"></div>
        <div class="rv-dot" id="reveal-d1" style="left: 380px; top: 212px"></div>
        <div class="rv-dot" id="reveal-d2" style="left: 556px; top: 212px"></div>
        <div class="rv-dot" id="reveal-d3" style="left: 380px; top: 308px"></div>
        <div class="rv-dot" id="reveal-d4" style="left: 556px; top: 308px"></div>

        <div class="rv-logo-wrap"><div class="rv-logo" id="reveal-logo">کوآپ</div></div>

        <!-- the blue panel that grows out of the wordmark -->
        <div class="rv-panel" id="reveal-panel">
          <div class="rv-sheen" id="reveal-sheen"></div>
          <div class="rv-line"><div class="rv-type"><span id="reveal-text"></span><span class="rv-caret" id="reveal-caret"></span></div></div>
        </div>

        <div class="rv-haze" id="reveal-haze"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const CX = 468, CY = 260;

          // hand-off from the hook's blur
          tl.fromTo("#reveal-haze", { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.out" }, 0.05);

          // wordmark blurs in, guide lines draw from the centre outwards
          tl.fromTo("#reveal-logo", { opacity: 0, filter: "blur(16px)", scale: 1.12 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power3.out" }, 0.3);
          tl.fromTo(["#reveal-h1", "#reveal-h2"], { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out", stagger: 0.06 }, 0.45);
          tl.fromTo(["#reveal-v1", "#reveal-v2"], { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out", stagger: 0.06 }, 0.5);
          tl.fromTo(["#reveal-d1", "#reveal-d2", "#reveal-d3", "#reveal-d4"], { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.05 }, 0.9);
          tl.set("#reveal-logo", { "--m": "0%" }, 0);
          tl.to("#reveal-logo", { scale: 1.04, duration: 1.5, ease: "sine.inOut" }, 1.0);

          // wordmark erases from both edges; lines close in to a seed at the centre
          tl.to("#reveal-logo", { "--m": "50%", filter: "blur(4px)", duration: 0.45, ease: "power2.in" }, 2.5);
          tl.set("#reveal-logo", { opacity: 0 }, 2.96);
          tl.to("#reveal-v1", { x: CX - 380 - 14, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-v2", { x: CX - 556 + 14, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-h1", { y: CY - 212 - 8, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-h2", { y: CY - 308 + 8, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-d1", { x: CX - 380 - 14, y: CY - 212 - 8, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-d2", { x: CX - 556 + 14, y: CY - 212 - 8, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-d3", { x: CX - 380 - 14, y: CY - 308 + 8, duration: 0.45, ease: "power3.in" }, 2.5);
          tl.to("#reveal-d4", { x: CX - 556 + 14, y: CY - 308 + 8, duration: 0.45, ease: "power3.in" }, 2.5);

          // seed → small card → full panel; lines are shoved back out to the frame
          tl.fromTo("#reveal-panel", { scaleX: 28 / 910, scaleY: 16 / 493, opacity: 0 }, { scaleX: 28 / 910, scaleY: 16 / 493, opacity: 1, duration: 0.08 }, 2.9);
          tl.to("#reveal-panel", { scaleX: 180 / 910, scaleY: 100 / 493, duration: 0.3, ease: "power3.out" }, 2.98);
          tl.to("#reveal-panel", { scaleX: 1, scaleY: 1, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-v1", "#reveal-d1", "#reveal-d3"], { x: 13 - 380, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-v2", "#reveal-d2", "#reveal-d4"], { x: 923 - 556, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-h1"], { y: 13 - 212, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-h2"], { y: 506 - 308, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-d1", "#reveal-d2"], { y: 13 - 212, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-d3", "#reveal-d4"], { y: 506 - 308, duration: 0.5, ease: "expo.inOut" }, 3.28);
          tl.to(["#reveal-h1", "#reveal-h2", "#reveal-v1", "#reveal-v2", "#reveal-d1", "#reveal-d2", "#reveal-d3", "#reveal-d4"], { opacity: 0, duration: 0.25 }, 3.7);
          tl.fromTo("#reveal-sheen", { x: 0 }, { x: 1300, duration: 2.6, ease: "sine.inOut" }, 3.4);

          // typewriter tagline
          const LINE = "مربی هوشمند تو، همیشه همراهت";
          const out = document.getElementById("reveal-text");
          const typer = { n: 0 };
          tl.fromTo(typer, { n: 0 }, {
            n: LINE.length, duration: 1.35, ease: "none",
            onUpdate: () => { out.textContent = LINE.slice(0, Math.round(typer.n)); },
          }, 3.72);
          // caret blink: finite, stepped
          tl.set("#reveal-caret", { opacity: 1 }, 3.7);
          tl.set("#reveal-caret", { opacity: 0 }, 5.12);
          tl.set("#reveal-caret", { opacity: 1 }, 5.3);

          // panel draws in to a rounded card, then pinches toward the voice orb
          tl.to("#reveal-panel", { scaleX: 0.6, scaleY: 0.62, borderRadius: 60, duration: 0.5, ease: "power3.inOut" }, 5.15);
          tl.to("#reveal-text", { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power1.in" }, 5.45);
          tl.to("#reveal-caret", { opacity: 0, duration: 0.01 }, 5.45);
          tl.to("#reveal-panel", { scaleX: 0.17, scaleY: 0.31, borderRadius: 300, opacity: 0, duration: 0.42, ease: "power3.in" }, 5.66);

          window.__timelines["reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
