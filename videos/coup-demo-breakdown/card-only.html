<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1872, height=1038" />
    <title>CoUp — Demo (card only, FA)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1872px; height: 1038px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      /* the scenes are authored at 936x519; scale the stage 2x to fill the frame */
      #card { position: absolute; left: 0; top: 0; width: 936px; height: 519px; overflow: hidden; background: #ffffff;
        transform-origin: 0 0; transform: scale(2); }
      .scene-slot { position: absolute; left: 0; top: 0; width: 936px; height: 519px; }
      #end-veil { position: absolute; inset: 0; background: #2b2f3d; opacity: 0; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card-only" data-start="0" data-duration="32.2" data-width="1872" data-height="1038">
      <div id="card">
        <div id="slot-hook" class="scene-slot" data-composition-id="hook" data-composition-src="compositions/hook.html"
          data-start="0" data-duration="7.6" data-track-index="1" data-width="936" data-height="519"></div>
        <div id="slot-reveal" class="scene-slot" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
          data-start="7.2" data-duration="6.1" data-track-index="2" data-width="936" data-height="519"></div>
        <div id="slot-demo" class="scene-slot" data-composition-id="demo" data-composition-src="compositions/demo.html"
          data-start="12.9" data-duration="10.1" data-track-index="1" data-width="936" data-height="519"></div>
        <div id="slot-growth" class="scene-slot" data-composition-id="growth" data-composition-src="compositions/growth.html"
          data-start="22.6" data-duration="5.8" data-track-index="2" data-width="936" data-height="519"></div>
        <div id="slot-cta" class="scene-slot" data-composition-id="cta" data-composition-src="compositions/cta.html"
          data-start="28" data-duration="4.2" data-track-index="1" data-width="936" data-height="519"></div>
      </div>
      <div id="end-veil"></div>

      <!-- music bed: audio track extracted from the user's reference video -->
      <audio id="bgm" src="assets/bgm/reference-track.m4a" data-start="0" data-duration="32.1" data-track-index="9" data-volume="0.9"></audio>

      <!-- sound design (bundled offline SFX library), tucked under the music -->
      <audio id="sfx-open" src="assets/sfx/whoosh.mp3" data-start="0.05" data-duration="0.57" data-track-index="10" data-volume="0.17"></audio>
      <audio id="sfx-click-today" src="assets/sfx/click.mp3" data-start="3.85" data-duration="0.37" data-track-index="11" data-volume="0.23"></audio>
      <audio id="sfx-pop-month" src="assets/sfx/pop.mp3" data-start="4.0" data-duration="0.72" data-track-index="12" data-volume="0.15"></audio>
      <audio id="sfx-out-hook" src="assets/sfx/whoosh-short.mp3" data-start="6.9" data-duration="0.57" data-track-index="10" data-volume="0.15"></audio>
      <audio id="sfx-logo" src="assets/sfx/sparkle.mp3" data-start="7.5" data-duration="1.8" data-track-index="11" data-volume="0.12"></audio>
      <audio id="sfx-panel" src="assets/sfx/whoosh.mp3" data-start="9.9" data-duration="0.57" data-track-index="12" data-volume="0.17"></audio>
      <audio id="sfx-type-1" src="assets/sfx/typing.mp3" data-start="10.9" data-duration="1.54" data-track-index="10" data-volume="0.15"></audio>
      <audio id="sfx-orb" src="assets/sfx/whoosh-short.mp3" data-start="12.8" data-duration="0.57" data-track-index="11" data-volume="0.15"></audio>
      <audio id="sfx-type-2" src="assets/sfx/typing.mp3" data-start="13.6" data-duration="1.54" data-track-index="12" data-volume="0.15"></audio>
      <audio id="sfx-list" src="assets/sfx/whoosh.mp3" data-start="16.0" data-duration="0.57" data-track-index="10" data-volume="0.15"></audio>
      <audio id="sfx-overload" src="assets/sfx/pop.mp3" data-start="21.3" data-duration="0.72" data-track-index="11" data-volume="0.15"></audio>
      <audio id="sfx-growth" src="assets/sfx/impact-bass-1.mp3" data-start="22.6" data-duration="2.12" data-track-index="12" data-volume="0.15"></audio>
      <audio id="sfx-dash" src="assets/sfx/whoosh-short.mp3" data-start="25.1" data-duration="0.57" data-track-index="10" data-volume="0.15"></audio>
      <audio id="sfx-cta" src="assets/sfx/chime.mp3" data-start="28.2" data-duration="2.54" data-track-index="11" data-volume="0.15"></audio>
      <audio id="sfx-cta-click" src="assets/sfx/click.mp3" data-start="29.8" data-duration="0.37" data-track-index="12" data-volume="0.23"></audio>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#end-veil", { opacity: 0 }, { opacity: 0.62, duration: 0.55, ease: "power1.in" }, 31.6);
        window.__timelines["card-only"] = tl;
      })();
    </script>
  </body>
</html>
